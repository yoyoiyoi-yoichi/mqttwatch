[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mqttwatch"
version = "0.1.0"
description = "A passive watchdog for MQTT brokers: connection history, topic traffic and retained-message inventory, using only the Python standard library."
requires-python = ">=3.10"
license = { text = "MIT" }

[project.scripts]
mqttwatch = "mqttwatch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
